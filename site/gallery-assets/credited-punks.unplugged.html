const stage=document.getElementById('stage'),ogStill=document.getElementById('ogStill'),artStill=document.getElementById('artStill');
function fitStage(){
  const dpr=window.devicePixelRatio||1;
  const unit=Math.max(1,Math.floor(Math.min(innerWidth,innerHeight)*dpr/24));
  const physicalSize=unit*24;
  stage.style.width=stage.style.height=physicalSize/dpr+'px';
  stage.style.left=Math.round((innerWidth*dpr-physicalSize)/2)/dpr+'px';
  stage.style.top=Math.round((innerHeight*dpr-physicalSize)/2)/dpr+'px';
}
fitStage();addEventListener('resize',fitStage);
const load=src=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=src});
const scratch=document.createElement('canvas');scratch.width=scratch.height=24;
const ctx=scratch.getContext('2d',{willReadFrequently:true});
function capture(image){ctx.clearRect(0,0,24,24);ctx.drawImage(image,0,0,24,24);return ctx.getImageData(0,0,24,24).data}
function face(pixels,tx,ty,back){
  const canvas=document.createElement('canvas');canvas.width=canvas.height=3;
  canvas.className='face '+(back?'back':'front');
  const c=canvas.getContext('2d'),tile=c.createImageData(3,3);
  for(let y=0;y<3;y++)for(let x=0;x<3;x++){
    const source=((ty*3+y)*24+tx*3+x),target=(y*3+x)*4;
    for(let k=0;k<4;k++)tile.data[target+k]=pixels[source*4+k];
  }
  c.putImageData(tile,0,0);return canvas;
}
let tiles=[],playing=false,timer,settleTimer;
function build(original,final){
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){
    let occupied=false;
    for(let py=0;py<3;py++)for(let px=0;px<3;px++){
      const i=(y*3+py)*24+x*3+px;
      if(mask[i>>3]&(1<<(i&7)))occupied=true;
    }
    if(!occupied)continue;
    const tile=document.createElement('div');tile.className='tile mutated';tile.dataset.index=y*8+x;
    tile.style.cssText=`left:${x*12.5}%;top:${y*12.5}%;width:12.5%;height:12.5%;--delay:${(y*8+x)*22}ms`;
    tile.append(face(original,x,y,false),face(final,x,y,true));stage.append(tile);tiles.push(tile);
  }
}
function setMutated(value){for(const tile of tiles)tile.classList.toggle('mutated',value)}
function flipToArt(){
  if(!tiles.some(tile=>!tile.classList.contains('mutated'))){ogStill.hidden=true;artStill.hidden=false;return}
  ogStill.hidden=true;setMutated(true);
  clearTimeout(settleTimer);settleTimer=setTimeout(()=>artStill.hidden=false,1750);
}
function cycle(){
  if(!playing)return;
  clearTimeout(settleTimer);artStill.hidden=true;ogStill.hidden=false;
  stage.classList.add('resetting');
  setMutated(false);
  void stage.offsetWidth;
  stage.classList.remove('resetting');
  timer=setTimeout(()=>{if(!playing)return;flipToArt();
    timer=setTimeout(cycle,4400);
  },900);
}
function toggle(){
  if(!tiles.length)return;
  playing=!playing;clearTimeout(timer);
  if(playing)cycle();else flipToArt();
  stage.setAttribute('aria-label',playing?'Stop color flip':'Play color flip');
}
stage.addEventListener('click',e=>{if(e.button===0)toggle()});
stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
Promise.all([load(originalURI),load(finalURI)]).then(([a,b])=>{ogStill.src=originalURI;artStill.src=finalURI;build(capture(a),capture(b))});
